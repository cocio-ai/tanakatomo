<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>極秘業務指示システム</title>
<style>
    body {
        font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", sans-serif;
        background-color: #000; /* スマホ風の黒背景 */
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
    }
    .mobile-container {
        width: 100%;
        max-width: 400px;
        height: 100vh;
        max-height: 850px;
        background-color: #ffffff;
        position: relative;
        display: none; /* JSで切り替え */
        flex-direction: column;
    }
    
    /* --- 1. スマホ風パスコード画面 --- */
    #passcode-screen {
        display: flex; /* 最初はこれを表示 */
        background-color: #1c1c1e;
        color: white;
        align-items: center;
        padding-top: 80px;
    }
    .pw-title {
        font-size: 18px;
        margin-bottom: 30px;
    }
    .dots {
        display: flex;
        gap: 20px;
        margin-bottom: 50px;
    }
    .dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 1px solid #fff;
        background-color: transparent;
    }
    .dot.filled {
        background-color: #fff;
    }
    .numpad {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px 30px;
        padding: 0 40px;
    }
    .num-btn {
        width: 75px;
        height: 75px;
        border-radius: 50%;
        background-color: rgba(255, 255, 255, 0.15);
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 32px;
        color: white;
        cursor: pointer;
        user-select: none;
    }
    .num-btn:active {
        background-color: rgba(255, 255, 255, 0.4);
    }
    .error-shake {
        animation: shake 0.4s;
    }
    @keyframes shake {
        0% { transform: translateX(0); }
        25% { transform: translateX(-10px); }
        50% { transform: translateX(10px); }
        75% { transform: translateX(-10px); }
        100% { transform: translateX(0); }
    }

    /* --- 各種共通ヘッダー --- */
    .header {
        background-color: #0033cc;
        color: #ffffff;
        font-size: 16px;
        font-weight: bold;
        text-align: center;
        padding: 12px 0;
        letter-spacing: 2px;
    }

    /* --- 2. 待機画面 --- */
    #standby-screen {
        background-color: #f0f0f0;
    }
    .intro-text {
        font-size: 14px;
        color: #333;
        text-align: left;
        line-height: 1.6;
        border: 2px solid #ff9900;
        background-color: #ffffee;
        padding: 15px;
        margin: 20px;
        font-weight: bold;
    }
    .status-text {
        text-align: center;
        font-size: 14px;
        color: #666;
        margin-top: 10px;
    }
    .trigger-btn {
        background-color: #cc0000;
        color: white;
        padding: 18px 20px;
        font-size: 18px;
        border: 2px outset #ff6666;
        cursor: pointer;
        width: 80%;
        margin: 20px auto 0;
        font-weight: bold;
        display: block;
        border-radius: 8px;
    }
    .trigger-btn:active {
        border-style: inset;
    }
    .director-credit {
        position: absolute;
        bottom: 20px;
        right: 20px;
        font-size: 13px;
        color: #999;
    }

    /* --- 3. 着信画面（鬼電） --- */
    #calling-screen {
        background-color: #111;
        color: #fff;
        justify-content: center;
        align-items: center;
    }
    .blink-text {
        font-size: 24px;
        color: #00ff00;
        animation: blink 0.5s infinite alternate;
        margin-bottom: 20px;
    }
    @keyframes blink {
        0% { opacity: 1; }
        100% { opacity: 0; }
    }
    .caller-name {
        font-size: 32px;
        font-weight: bold;
        margin-bottom: 60px;
    }
    .call-btn {
        background-color: #00cc00;
        color: white;
        padding: 15px 0;
        font-size: 20px;
        font-weight: bold;
        border: none;
        border-radius: 30px;
        width: 70%;
        cursor: pointer;
    }
    .call-btn:active { opacity: 0.7; }

    /* --- 4. メール画面（指示書） --- */
    #mail-screen {
        background-color: #f0f0f0;
    }
    .mail-form {
        padding: 15px;
        flex: 1;
    }
    .form-group {
        border-bottom: 1px dotted #999;
        padding: 10px 0;
        display: flex;
        align-items: center;
    }
    .form-group label {
        color: #0033cc;
        font-size: 14px;
        width: 60px;
        font-weight: bold;
    }
    .form-group input {
        border: none;
        outline: none;
        font-size: 16px;
        width: calc(100% - 70px);
        background-color: transparent;
        color: #333;
    }
    .body-group {
        padding: 15px 0;
    }
    .body-group label {
        color: #0033cc;
        font-size: 14px;
        font-weight: bold;
        display: block;
        margin-bottom: 8px;
    }
    .body-group textarea {
        width: 100%;
        height: 250px;
        border: 1px solid #ccc;
        font-size: 15px;
        padding: 12px;
        box-sizing: border-box;
        resize: none;
        background-color: #fafafa;
        line-height: 1.6;
    }
    .footer-buttons {
        padding: 15px;
        background-color: #e0e0e0;
        border-top: 1px solid #ccc;
        text-align: center;
    }
    .btn {
        background-color: #f8f8f8;
        border: 1px outset #ccc;
        padding: 12px 40px;
        font-size: 16px;
        cursor: pointer;
        font-weight: bold;
    }
    .btn:active {
        border: 1px inset #ccc;
    }
</style>
</head>
<body>

<!-- 1. パスコードロック画面 -->
<div id="passcode-screen" class="mobile-container">
    <div class="pw-title">パスコードを入力</div>
    <div class="dots" id="dots-container">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>
    <div class="numpad">
        <div class="num-btn" onclick="pressNum('1')">1</div>
        <div class="num-btn" onclick="pressNum('2')">2</div>
        <div class="num-btn" onclick="pressNum('3')">3</div>
        <div class="num-btn" onclick="pressNum('4')">4</div>
        <div class="num-btn" onclick="pressNum('5')">5</div>
        <div class="num-btn" onclick="pressNum('6')">6</div>
        <div class="num-btn" onclick="pressNum('7')">7</div>
        <div class="num-btn" onclick="pressNum('8')">8</div>
        <div class="num-btn" onclick="pressNum('9')">9</div>
        <div></div>
        <div class="num-btn" onclick="pressNum('0')">0</div>
        <div></div>
    </div>
</div>

<!-- 2. 待機画面 -->
<div id="standby-screen" class="mobile-container">
    <div class="header">i-mode アイコミ待機中</div>
    <div class="intro-text">
        ブラック企業の社畜である皆さんは今日の主役である田中智先生の指示にすべて答える必要があります。<br><br>
        これから指示のアイコミを流しますので、それぞれしっかりと報告して下さい。
    </div>
    <div class="status-text" id="status-counter">次の指示を受信します</div>
    <button class="trigger-btn" onclick="startCall()">着信を発動する</button>
    <div class="director-credit">directed by ファンタオナニスタ蟹江</div>
</div>

<!-- 3. 着信画面（鬼電） -->
<div id="calling-screen" class="mobile-container">
    <div class="blink-text">着信中...</div>
    <div class="caller-name">田中 智 DM</div>
    <button class="call-btn" onclick="answerCall()">応答する</button>
</div>

<!-- 4. メール画面（指示書） -->
<div id="mail-screen" class="mobile-container">
    <div class="header">ﾒｰﾙ受信</div>
    <div class="mail-form">
        <div class="form-group">
            <label>差出人</label>
            <input type="text" id="mail-sender" readonly>
        </div>
        <div class="form-group">
            <label>宛先</label>
            <input type="text" id="mail-receiver" readonly>
        </div>
        <div class="form-group">
            <label>件名</label>
            <input type="text" id="mail-subject" readonly>
        </div>
        <div class="body-group">
            <label>本文</label>
            <textarea id="mail-body" readonly></textarea>
        </div>
    </div>
    <div class="footer-buttons">
        <button class="btn" onclick="finishMission()">承知いたしました</button>
    </div>
</div>

<!-- 音声ファイル -->
<audio id="call-sound" src="https://www.soundjay.com/phone/telephone-ring-04.mp3" loop preload="auto"></audio>
<audio id="mail-sound" src="https://www.soundjay.com/buttons/sounds/button-09.mp3" preload="auto"></audio>

<script>
    // ▼ 指示リスト（順番は固定） ▼
    const missions = [
        { sender: "田中智", receiver: "吉野", subject: "本日の業務指示", body: "【指示事項】\n\n鉄雄を殴る花道になりきり\n『これはカニちゃんの分！』\nと言って乾杯の音頭を取りなさい。" },
        { sender: "田中智", receiver: "森", subject: "本日の業務指示", body: "【指示事項】\n\n目の前のアルコールドリンクを\nすべて平らげた上で、\n\n田中先輩にSEJ関係者（店舗従業員含む）\n何人と関係を持ったか\n正確に報告せよ。" },
        { sender: "田中智", receiver: "安藤", subject: "本日の業務指示", body: "【指示事項】\n\nあなたはカタギではないので、\n大人しくしていて下さい。" },
        { sender: "田中智", receiver: "井上", subject: "本日の業務指示", body: "【指示事項】\n\n田中さんの乳首に人差し指を当てて\n\n北大出身の田中さんへ\n『智くんよ、大志を抱け』\nと言ってあげなさい。" },
        { sender: "田中智", receiver: "冨澤", subject: "本日の業務指示", body: "【指示事項】\n\n財布にある一番大きな額のお札を、\n田中智の胸ポケットに\nそっと入れなさい。" },
        { sender: "田中智", receiver: "天野", subject: "本日の業務指示", body: "【指示事項】\n\n今はシュッとした出世頭になっているが\n昔のかなりイキっていた頃の\n写真があるはず。\n\nそれを皆に公開せよ。" },
        { sender: "田中智", receiver: "谷", subject: "本日の業務指示", body: "【指示事項】\n\nあなたには未来があります。\n\nここにいる連中とお付き合いするのは\n控えた方が良いと思います。" },
        { sender: "田中智", receiver: "菊屋", subject: "本日の業務指示", body: "【指示事項】\n\n最近の奥さんとの性生活の状況を\n素直に答えなさい。" },
        { sender: "田中智", receiver: "松崎", subject: "本日の業務指示", body: "【指示事項】\n\nあなたは関西出身なので\nなにわのモーツァルト、\nキダタローのモノマネでもして\n周りを冷笑させなさい。" },
        { sender: "蟹江", receiver: "田中智", subject: "送別の言葉", body: "（ここに後ほどメッセージを記入します。\n準備ができたら教えてください）" }
    ];

    let currentIndex = 0;
    
    // --- パスコード関連の処理 ---
    const SECRET_PW = "0721";
    let inputPw = "";
    let isAudioInited = false;

    function pressNum(num) {
        // 音声の事前ロード（スマホブラウザの制限回避）
        if (!isAudioInited) {
            document.getElementById('call-sound').volume = 0;
            document.getElementById('mail-sound').volume = 0;
            Promise.all([
                document.getElementById('call-sound').play(),
                document.getElementById('mail-sound').play()
            ]).then(() => {
                document.getElementById('call-sound').pause();
                document.getElementById('call-sound').currentTime = 0;
                document.getElementById('call-sound').volume = 1;
                document.getElementById('mail-sound').pause();
                document.getElementById('mail-sound').currentTime = 0;
                document.getElementById('mail-sound').volume = 1;
                isAudioInited = true;
            }).catch(e => console.log(e));
        }

        if (inputPw.length < 4) {
            inputPw += num;
            updateDots();
        }
        
        if (inputPw.length === 4) {
            setTimeout(checkPasscode, 200); // 少し待ってから判定
        }
    }

    function updateDots() {
        const dots = document.querySelectorAll('.dot');
        dots.forEach((dot, index) => {
            if (index < inputPw.length) {
                dot.classList.add('filled');
            } else {
                dot.classList.remove('filled');
            }
        });
    }

    function checkPasscode() {
        if (inputPw === SECRET_PW) {
            // パスコード正解：待機画面へ
            document.getElementById('passcode-screen').style.display = 'none';
            document.getElementById('standby-screen').style.display = 'flex';
        } else {
            // 不正解：ブルッと震えて赤くなりリセット
            if (navigator.vibrate) navigator.vibrate(300);
            const container = document.getElementById('passcode-screen');
            const dots = document.getElementById('dots-container');
            container.style.backgroundColor = "#4a0000"; // 一瞬赤くする
            dots.classList.add('error-shake');
            
            setTimeout(() => {
                inputPw = "";
                updateDots();
                container.style.backgroundColor = "#1c1c1e";
                dots.classList.remove('error-shake');
            }, 500);
        }
    }

    // --- アイコミ受信・進行の処理 ---
    function startCall() {
        if (currentIndex >= missions.length) {
            alert("全ての指示が完了しました。");
            return;
        }
        
        // 待機画面を隠して着信画面を表示
        document.getElementById('standby-screen').style.display = 'none';
        document.getElementById('calling-screen').style.display = 'flex';
        
        // 鬼電サウンド再生＆バイブ
        const callSound = document.getElementById('call-sound');
        callSound.currentTime = 0;
        callSound.play().catch(e => console.log(e));
        
        if (navigator.vibrate) {
            navigator.vibrate([1000, 500, 1000, 500, 1000, 500, 1000]); 
        }
    }

    function answerCall() {
        // 着信音・バイブを止める
        document.getElementById('call-sound').pause();
        if (navigator.vibrate) navigator.vibrate(0);

        // 指示内容をセット
        const currentMission = missions[currentIndex];
        
        // 最後の蟹江さんからのメッセージだけ差出人を変更
        if (currentMission.sender === "蟹江") {
            document.querySelector('#calling-screen .caller-name').innerText = "蟹江 明雄";
        }

        document.getElementById('mail-sender').value = currentMission.sender;
        document.getElementById('mail-receiver').value = currentMission.receiver;
        document.getElementById('mail-subject').value = currentMission.subject;
        document.getElementById('mail-body').value = currentMission.body;
        
        // ピロリン音を鳴らしてメール画面へ
        document.getElementById('mail-sound').play().catch(e => console.log(e));
        document.getElementById('calling-screen').style.display = 'none';
        document.getElementById('mail-screen').style.display = 'flex';
        
        currentIndex++; // 内部カウントを進める
    }

    function finishMission() {
        // メール画面を閉じて待機画面へ戻る
        document.getElementById('mail-screen').style.display = 'none';
        
        if (currentIndex >= missions.length) {
            document.getElementById('status-counter').innerText = "全てのプログラムが終了しました。";
            document.querySelector('.trigger-btn').style.display = 'none';
        } else {
            document.getElementById('status-counter').innerText = `次の指示を受信します (${currentIndex + 1}/${missions.length})`;
        }
        
        document.getElementById('standby-screen').style.display = 'flex';
    }
</script>

</body>
</html>
