<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>極秘業務指示システム</title>
<!-- バーコード読み取り用のライブラリを読み込み -->
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<style>
    body {
        font-family: "MS PGothic", "Hiragino Kaku Gothic ProN", sans-serif;
        background-color: #f0f0f0;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }
    .mobile-container {
        width: 100%;
        max-width: 400px;
        background-color: #ffffff;
        border: 2px solid #ccc;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        display: none;
    }
    #scan-screen {
        display: block; /* 初期表示 */
        text-align: center;
        padding: 20px;
    }
    .header {
        background-color: #0033cc;
        color: #ffffff;
        font-size: 16px;
        font-weight: bold;
        text-align: center;
        padding: 8px 0;
        letter-spacing: 2px;
        margin-bottom: 15px;
    }
    /* カメラ映像の表示エリア */
    #reader {
        width: 100%;
        margin-bottom: 15px;
        border: 2px solid #333;
        box-sizing: border-box;
    }
    .start-btn {
        background-color: #333;
        color: white;
        padding: 15px 20px;
        font-size: 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        width: 100%;
        font-weight: bold;
    }
    .mail-form {
        padding: 10px;
    }
    .form-group {
        border-bottom: 1px dotted #999;
        padding: 8px 0;
        display: flex;
        align-items: center;
    }
    .form-group label {
        color: #0033cc;
        font-size: 14px;
        width: 50px;
        font-weight: bold;
    }
    .form-group input {
        border: none;
        outline: none;
        font-size: 16px;
        width: calc(100% - 60px);
        background-color: transparent;
        color: #333;
    }
    .body-group {
        padding: 10px 0;
    }
    .body-group label {
        color: #0033cc;
        font-size: 14px;
        font-weight: bold;
        display: block;
        margin-bottom: 5px;
    }
    .body-group textarea {
        width: 100%;
        height: 180px;
        border: 1px solid #ccc;
        font-size: 15px;
        padding: 8px;
        box-sizing: border-box;
        resize: none;
        background-color: #fafafa;
        line-height: 1.5;
    }
    .footer-buttons {
        display: flex;
        justify-content: space-between;
        padding: 10px;
        background-color: #e0e0e0;
        border-top: 1px solid #ccc;
    }
    .btn {
        background-color: #f8f8f8;
        border: 1px outset #ccc;
        padding: 10px 20px;
        font-size: 14px;
        cursor: pointer;
        width: 45%;
        text-align: center;
    }
    .btn:active {
        border: 1px inset #ccc;
    }
</style>
</head>
<body>

<!-- 1. スキャン画面 -->
<div id="scan-screen" class="mobile-container">
    <div class="header">i-mode ﾊﾞｰｺｰﾄﾞﾘｰﾀﾞ</div>
    <p style="font-size: 13px; color: #666;">カメラを起動して対象を読み取ってください</p>
    
    <!-- ここにカメラの映像が出ます -->
    <div id="reader" style="display: none;"></div>
    
    <button id="start-btn" class="start-btn" onclick="startCamera()">カメラを起動する</button>
</div>

<!-- 2. メール画面 -->
<div id="mail-screen" class="mobile-container">
    <div class="header">ﾒｰﾙ作成(報告)</div>
    <div class="mail-form">
        <div class="form-group">
            <label>差出人</label>
            <input type="text" id="mail-sender" readonly>
        </div>
        <div class="form-group">
            <label>宛先</label>
            <input type="text" id="mail-receiver" value="田中DM" readonly>
        </div>
        <div class="form-group">
            <label>件名</label>
            <input type="text" id="mail-subject" value="本日の業務報告" readonly>
        </div>
        <div class="body-group">
            <label>本文</label>
            <textarea id="mail-body" readonly></textarea>
        </div>
    </div>
    <div class="footer-buttons">
        <button class="btn" onclick="resetScreen()">戻る</button>
        <button class="btn" onclick="alert('送信完了しました。')">送信</button>
    </div>
</div>

<audio id="ringtone" src="https://www.soundjay.com/buttons/sounds/button-09.mp3" preload="auto"></audio>

<script>
    // ミッション一覧（配列にすることでランダム抽出しやすくしています）
    const missions = [
        { sender: "吉野", body: "鉄雄を殴る花道になりきり『これはカニちゃんの分！』と言って乾杯の音頭を取りなさい" },
        { sender: "冨澤", body: "財布にある一番大きな額のお札を田中智の胸ポケットにそっと入れなさい" },
        { sender: "安藤", body: "あなたはカタギではないので、大人しくしていて下さい" },
        { sender: "菊屋", body: "最近の奥さんとの性生活の状況を素直に答えなさい" },
        { sender: "井上", body: "田中さんの乳首に人差し指を当てて北大出身の田中さんへ『智くんよ　大志を抱け』と言ってあげなさい" },
        { sender: "松崎", body: "あなたは関西出身なのでなにわのモーツァルト、キダタローのモノマネでもして周りを冷笑させなさい" },
        { sender: "森", body: "目の前のアルコールドリンクをすべて平らげた上で、田中先輩にSEJ関係者（店舗従業員含む）何人と関係を持ったか正確に報告せよ" },
        { sender: "谷", body: "あなたには未来があります、ここにいる連中とお付き合いするのは控えた方が良いと思います" },
        { sender: "天野", body: "今はシュッとした出世頭になっているが、昔のかなりイキっていた頃の写真があるはず。それを皆に公開せよ" }
    ];

    let html5QrCode;

    function startCamera() {
        // iPad(iOS)の仕様上、最初にユーザーが画面をタップした時に音声を空再生しないと、後から音が鳴らないための対策
        const ringtone = document.getElementById('ringtone');
        ringtone.volume = 0; // 一旦無音に
        ringtone.play().then(() => {
            ringtone.pause();
            ringtone.currentTime = 0;
            ringtone.volume = 1; // 音量を戻す
        }).catch(e => console.log("Audio init error:", e));

        // UIの切り替え
        document.getElementById('start-btn').style.display = 'none';
        document.getElementById('reader').style.display = 'block';

        // カメラの起動処理（環境カメラ＝外側のカメラを使用）
        html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start(
            { facingMode: "environment" },
            {
                fps: 10,
                qrbox: { width: 250, height: 250 }
            },
            (decodedText, decodedResult) => {
                // ▼ バーコードを読み取った瞬間の処理 ▼
                html5QrCode.stop().then(() => {
                    // カメラを止めてランダム処理へ
                    document.getElementById('reader').style.display = 'none';
                    triggerRandomMission();
                }).catch(err => {
                    console.log("カメラ停止エラー", err);
                });
            },
            (errorMessage) => {
                // 読み取り中のエラーは無視してOK
            }
        ).catch((err) => {
            alert("カメラへのアクセスが拒否されたか、エラーが発生しました。");
            document.getElementById('start-btn').style.display = 'block';
            document.getElementById('reader').style.display = 'none';
        });
    }

    function triggerRandomMission() {
        // ランダムで1つ選ぶ
        const randomIndex = Math.floor(Math.random() * missions.length);
        const selectedMission = missions[randomIndex];

        // 画面にセット
        document.getElementById('mail-sender').value = selectedMission.sender;
        document.getElementById('mail-body').value = selectedMission.body;

        // 着信音を鳴らす
        const ringtone = document.getElementById('ringtone');
        ringtone.currentTime = 0;
        ringtone.play().catch(e => console.log("音声再生エラー:", e));

        // 0.8秒待ってからメール画面へ切り替え
        setTimeout(() => {
            document.getElementById('scan-screen').style.display = 'none';
            document.getElementById('mail-screen').style.display = 'block';
        }, 800);
    }

    function resetScreen() {
        // 戻るボタンを押した時、再びカメラ起動ボタンを表示
        document.getElementById('mail-screen').style.display = 'none';
        document.getElementById('scan-screen').style.display = 'block';
        document.getElementById('start-btn').style.display = 'block';
    }
</script>

</body>
</html>
