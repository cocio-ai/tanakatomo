<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>極秘業務指示システム</title>
<style>
    body {
        font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", sans-serif;
        background-color: #000;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
    }
    .mobile-container {
        width: 100%;
        max-width: 400px;
        height: 100vh;
        max-height: 850px;
        background-color: #ffffff;
        position: relative;
        display: none;
        flex-direction: column;
    }
    
    /* --- 1. スマホ風パスコード画面 --- */
    #passcode-screen {
        display: flex;
        background-color: #1c1c1e;
        color: white;
        align-items: center;
        padding-top: 80px;
    }
    .pw-title {
        font-size: 18px;
        margin-bottom: 30px;
    }
    .dots {
        display: flex;
        gap: 20px;
        margin-bottom: 50px;
    }
    .dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 1px solid #fff;
        background-color: transparent;
    }
    .dot.filled {
        background-color: #fff;
    }
    .numpad {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px 30px;
        padding: 0 40px;
    }
    .num-btn {
        width: 75px;
        height: 75px;
        border-radius: 50%;
        background-color: rgba(255, 255, 255, 0.15);
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 32px;
        color: white;
        cursor: pointer;
        user-select: none;
    }
    .num-btn:active {
        background-color: rgba(255, 255, 255, 0.4);
    }
    .error-shake {
        animation: shake 0.4s;
    }
    @keyframes shake {
        0% { transform: translateX(0); }
        25% { transform: translateX(-10px); }
        50% { transform: translateX(10px); }
        75% { transform: translateX(-10px); }
        100% { transform: translateX(0); }
    }

    /* --- 各種共通ヘッダー --- */
    .header {
        background-color: #0033cc;
        color: #ffffff;
        font-size: 16px;
        font-weight: bold;
        text-align: center;
        padding: 12px 0;
        letter-spacing: 2px;
    }

    /* --- 2. 待機画面 --- */
    #standby-screen {
        background-color: #f0f0f0;
    }
    .intro-text {
        font-size: 14px;
        color: #333;
        text-align: left;
        line-height: 1.6;
        border: 2px solid #ff9900;
        background-color: #ffffee;
        padding: 15px;
        margin: 20px;
        font-weight: bold;
        max-height: 300px;
        overflow-y: auto;
    }
    .intro-text a {
        color: #0033cc;
        text-decoration: underline;
    }
    .status-text {
        text-align: center;
        font-size: 14px;
        color: #666;
        margin-top: 10px;
    }
    .trigger-btn {
        background-color: #cc0000;
        color: white;
        padding: 18px 20px;
        font-size: 18px;
        border: 2px outset #ff6666;
        cursor: pointer;
        width: 80%;
        margin: 20px auto 0;
        font-weight: bold;
        display: block;
        border-radius: 8px;
    }
    .trigger-btn:active {
        border-style: inset;
    }

    /* --- 3. 着信画面（鬼電） --- */
    #calling-screen {
        background-color: #111;
        color: #fff;
        justify-content: center;
        align-items: center;
    }
    .blink-text {
        font-size: 24px;
        color: #00ff00;
        animation: blink 0.5s infinite alternate;
        margin-bottom: 20px;
    }
    @keyframes blink {
        0% { opacity: 1; }
        100% { opacity: 0; }
    }
    .caller-name {
        font-size: 32px;
        font-weight: bold;
        margin-bottom: 60px;
    }
    .call-btn {
        background-color: #00cc00;
        color: white;
        padding: 15px 0;
        font-size: 20px;
        font-weight: bold;
        border: none;
        border-radius: 30px;
        width: 70%;
        cursor: pointer;
    }
    .call-btn:active { opacity: 0.7; }

    /* --- 4. メール画面（指示書） --- */
    #mail-screen {
        background-color: #f0f0f0;
    }
    .mail-form {
        padding: 15px;
        flex: 1;
    }
    .form-group {
        border-bottom: 1px dotted #999;
        padding: 10px 0;
        display: flex;
        align-items: center;
    }
    .form-group label {
        color: #0033cc;
        font-size: 14px;
        width: 60px;
        font-weight: bold;
    }
    .form-group input {
        border: none;
        outline: none;
        font-size: 16px;
        width: calc(100% - 70px);
        background-color: transparent;
        color: #333;
    }
    .body-group {
        padding: 15px 0;
    }
    .body-group label {
        color: #0033cc;
        font-size: 14px;
        font-weight: bold;
        display: block;
        margin-bottom: 8px;
    }
    .body-group textarea {
        width: 100%;
        height: 280px;
        border: 1px solid #ccc;
        font-size: 15px;
        padding: 12px;
        box-sizing: border-box;
        resize: none;
        background-color: #fafafa;
        line-height: 1.6;
    }
    .footer-buttons {
        padding: 15px;
        background-color: #e0e0e0;
        border-top: 1px solid #ccc;
        text-align: center;
    }
    .btn {
        background-color: #f8f8f8;
        border: 1px outset #ccc;
        padding: 12px 40px;
        font-size: 16px;
        cursor: pointer;
        font-weight: bold;
    }
    .btn:active {
        border: 1px inset #ccc;
    }
</style>
</head>
<body>

<div id="passcode-screen" class="mobile-container">
    <div class="pw-title">パスコードを入力</div>
    <div class="dots" id="dots-container">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>
    <div class="numpad">
        <div class="num-btn" onclick="pressNum('1')">1</div>
        <div class="num-btn" onclick="pressNum('2')">2</div>
        <div class="num-btn" onclick="pressNum('3')">3</div>
        <div class="num-btn" onclick="pressNum('4')">4</div>
        <div class="num-btn" onclick="pressNum('5')">5</div>
        <div class="num-btn" onclick="pressNum('6')">6</div>
        <div class="num-btn" onclick="pressNum('7')">7</div>
        <div class="num-btn" onclick="pressNum('8')">8</div>
        <div class="num-btn" onclick="pressNum('9')">9</div>
        <div></div>
        <div class="num-btn" onclick="pressNum('0')">0</div>
        <div></div>
    </div>
</div>

<div id="standby-screen" class="mobile-container">
    <div class="header">i-mode アイコミ待機中</div>
    <div class="intro-text" id="intro-box">
        ブラック企業の社畜である皆さんは今日の主役である田中智先生の指示にすべて答える必要があります。<br><br>
        これから指示のアイコミを流しますので、それぞれしっかりと報告して下さい。
    </div>
    <div class="status-text" id="status-counter">次の指示を受信します</div>
    <button class="trigger-btn" onclick="startCall()">着信を発動する</button>
</div>

<div id="calling-screen" class="mobile-container">
    <div class="blink-text">着信中...</div>
    <div class="caller-name">田中 智 DM</div>
    <button class="call-btn" onclick="answerCall()">応答する</button>
</div>

<div id="mail-screen" class="mobile-container">
    <div class="header">ﾒｰﾙ受信</div>
    <div class="mail-form">
        <div class="form-group">
            <label>差出人</label>
            <input type="text" id="mail-sender" readonly>
        </div>
        <div class="form-group">
            <label>宛先</label>
            <input type="text" id="mail-receiver" readonly>
        </div>
        <div class="form-group">
            <label>件名</label>
            <input type="text" id="mail-subject" readonly>
        </div>
        <div class="body-group">
            <label>本文</label>
            <textarea id="mail-body" readonly></textarea>
        </div>
    </div>
    <div class="footer-buttons">
        <button class="btn" onclick="finishMission()">実施しました</button>
    </div>
</div>

<!-- 安定して音源を読み込めるCDNサーバーに変更 -->
<audio id="call-sound" src="https://assets.mixkit.co/active_storage/sfx/1354/1354-preview.mp3" loop preload="auto"></audio>
<audio id="mail-sound" src="https://assets.mixkit.co/active_storage/sfx/2574/2574-preview.mp3" preload="auto"></audio>

<script>
    const missions = [
        { 
            sender: "田中智", receiver: "吉野", subject: "本日の業務指示", 
            body: "【指示事項】\n\n鉄雄を殴る花道になりきり\n『これはカニちゃんの分！』\nと言って乾杯の音頭を取りなさい。",
            nextIntro: "ドパガキの皆さん仕組みは分かりましたか<br><br>ちゃんと指示に従って下さいね。<br>特に冨澤さん・森さん・松崎さん" 
        },
        { 
            sender: "田中智", receiver: "森", subject: "本日の業務指示", 
            body: "【指示事項】\n\n目の前のアルコールドリンクを\nすべて平らげた上で、\n\n田中先輩にSEJ関係者（店舗従業員含む）\n何人と関係を持ったか\n正確に報告せよ。",
            nextIntro: "【おすすめ店舗のご紹介】<br>〜セブンイレブン尾張旭晴丘町池上店〜<br><br>つくば駅から当店までのルートと所要時間：<br>TXで秋葉原へ出て、東京から東海道新幹線で名古屋へ。地下鉄東山線で藤が丘まで行き、名鉄バスで「晴丘」下車。<br>所要時間：片道約3時間45分<br><br>遠いとか文句言わずにいつでも気軽に来店しなさい。" 
        },
        { 
            sender: "田中智", receiver: "安藤", subject: "本日の業務指示", 
            body: "【指示事項】\n\nあなたはカタギではないので、\n大人しくしていて下さい。",
            nextIntro: "【おすすめ店舗のご紹介】<br>〜セブンイレブン尾張旭晴丘町池上店〜<br><br>Googleマップ評価：3.7（9月時点）<br><br><a href='https://maps.app.goo.gl/tWpS8jH3Y9F2T3hE8' target='_blank'>📍Googleマップを開く</a><br><br>ここにいる全員は今から星5評価を付けて下さい。絶対命令です。" 
        },
        { 
            sender: "田中智", receiver: "井上", subject: "本日の業務指示", 
            body: "【指示事項】\n\n田中智の乳首に人差し指を当てて\n\n北大出身の田中さんへ\n『智くんよ、大志を抱け』\nと言って気持ちよく送り出してあげて下さい。",
            nextIntro: "【尾張旭市のご紹介】<br>当店がある尾張旭市は「おいしい紅茶の店」店舗数日本一に輝いた『紅茶の街』です。<br><br>ブラック企業で搾取され、荒みきったお前らの心を紅茶で少しは浄化しなさい。当然、セブンカフェのお茶を買って売上に貢献すること。" 
        },
        { 
            sender: "田中智", receiver: "冨澤", subject: "本日の業務指示", 
            body: "【指示事項】\n\n財布にある一番大きな額のお札を、\n田中智の胸ポケットに\nそっと入れなさい。",
            nextIntro: "【店舗公式Instagramのお知らせ】<br>セブンイレブン尾張旭晴丘町池上店ではインスタグラムを発信しています。<br><br><a href='https://www.instagram.com/711ikegami/' target='_blank'>📷 @711ikegami を見る</a><br><br>フォローしていない参加者は必ず追い込みます。今すぐフォローしなさい。" 
        },
        { 
            sender: "田中智", receiver: "天野", subject: "本日の業務指示", 
            body: "【指示事項】\n\n今はシュッとした出世頭になっているが\n昔のかなりイキっていた頃の\n写真があるはず。\n\nそれを皆に公開せよ。",
            nextIntro: "【近況報告①】<br><br>今年長女と次女がダブルで受験生となっています。<br>来年大学と高校に行くようになったら強制的に当店でのアルバイトが始まります。<br><br>家族経営とはこんなものです。" 
        },
        { 
            sender: "田中智", receiver: "谷", subject: "本日の業務指示", 
            body: "【指示事項】\n\nあなたには未来があります。\n\nここにいる連中とお付き合いするのは\n控えた方が良いと思います。",
            nextIntro: "【近況報告②】<br><br>一昨年より森間伐の会に所属し、主に秋から春にかけて瀬戸市の森で木を切っています。<br><br>薪が欲しい方は針葉樹１束3キロ1,000円、広葉樹１束3キロ2,000円で売ってあげますので連絡ください。" 
        },
        { 
            sender: "田中智", receiver: "菊屋", subject: "本日の業務指示", 
            body: "【指示事項】\n\n最近の奥さんとの性生活の状況を\n素直に答えなさい。",
            nextIntro: "森くんはそろそろトイレに行ってリバースして来るタイミングじゃないですか？" 
        },
        { 
            sender: "田中智", receiver: "松崎", subject: "本日の業務指示", 
            body: "【指示事項】\n\nあなたは関西出身なので\nなにわのモーツァルト、\nキダタローのモノマネでもして\n周りを冷笑させなさい。",
            nextIntro: "OFCとして一番の思い出は、北茨城大津港駅前店のリニューアルオープンフォローの為に前泊したにもかかわらず、5分だけしかフォローできなかった事です。<br><br>吉野さん、あの時は本当にすいませんでした。最高の思い出です。" 
        },
        { 
            sender: "蟹江", receiver: "田中智", subject: "送別の言葉", 
            body: "田中さんへ\n今までセブンイレブンでの業務お疲れ様でした\n私はタナが辞めるとだけしか聞いてないし、そこにいる誰も今後何するか教えてくれていないので、あなたが今後どこでどう活躍するのかわからないのでエールのしようがありません\nただあなたの活躍を祈るのみです\n\n唯一のお願いは辞める前に阿久津社長に対してしっかりと社長辞めろという誹謗中傷の置き土産をして頂きたいという事だけです\nそれが最後の業務だと信じています\n\nちなみに一緒に働いている時にタナから完全に舐められていたのは気付いていました\nもうこれ以上愛知でひっそりと店舗経営をしているオーナーを舐め切るのを勘弁して欲しいです\nそこそこ頑張って日常を過ごしています\n\nまあとにかくこれからもタナらしく何事もスマートにこなして楽しく過ごして下さいね\n長い間のセブンイレブンジャパンでの勤務大変お疲れ様でした！！",
            nextIntro: "皆様ここまで見て頂き誠にありがとうございました。<br><br>ここにいる皆様の益々のご活躍を陰ながら祈願しております。<br><br>蟹江明雄より" 
        }
    ];

    let currentIndex = 0;
    
    // --- パスコード関連の処理 ---
    const SECRET_PW = "0721";
    let inputPw = "";
    let isAudioInited = false;

    function pressNum(num) {
        if (!isAudioInited) {
            const callSound = document.getElementById('call-sound');
            const mailSound = document.getElementById('mail-sound');
            callSound.volume = 0;
            mailSound.volume = 0;
            Promise.all([
                callSound.play(),
                mailSound.play()
            ]).then(() => {
                callSound.pause();
                callSound.currentTime = 0;
                callSound.volume = 1;
                mailSound.pause();
                mailSound.currentTime = 0;
                mailSound.volume = 1;
                isAudioInited = true;
            }).catch(e => console.log(e));
        }

        if (inputPw.length < 4) {
            inputPw += num;
            updateDots();
        }
        
        if (inputPw.length === 4) {
            setTimeout(checkPasscode, 200);
        }
    }

    function updateDots() {
        const dots = document.querySelectorAll('.dot');
        dots.forEach((dot, index) => {
            if (index < inputPw.length) {
                dot.classList.add('filled');
            } else {
                dot.classList.remove('filled');
            }
        });
    }

    function checkPasscode() {
        if (inputPw === SECRET_PW) {
            document.getElementById('passcode-screen').style.display = 'none';
            document.getElementById('standby-screen').style.display = 'flex';
        } else {
            if (navigator.vibrate) navigator.vibrate(300);
            const container = document.getElementById('passcode-screen');
            const dots = document.getElementById('dots-container');
            container.style.backgroundColor = "#4a0000";
            dots.classList.add('error-shake');
            
            setTimeout(() => {
                inputPw = "";
                updateDots();
                container.style.backgroundColor = "#1c1c1e";
                dots.classList.remove('error-shake');
            }, 500);
        }
    }

    // --- アイコミ受信・進行の処理 ---
    function startCall() {
        if (currentIndex >= missions.length) {
            alert("全ての指示が完了しました。");
            return;
        }
        
        document.getElementById('standby-screen').style.display = 'none';
        document.getElementById('calling-screen').style.display = 'flex';
        
        const callSound = document.getElementById('call-sound');
        callSound.currentTime = 0;
        callSound.play().catch(e => console.log(e));
        
        if (navigator.vibrate) {
            navigator.vibrate([1000, 500, 1000, 500, 1000, 500, 1000]); 
        }
    }

    function answerCall() {
        document.getElementById('call-sound').pause();
        if (navigator.vibrate) navigator.vibrate(0);

        const currentMission = missions[currentIndex];
        
        if (currentMission.sender === "蟹江") {
            document.querySelector('#calling-screen .caller-name').innerText = "蟹江 明雄";
        } else {
            document.querySelector('#calling-screen .caller-name').innerText = "田中 智 DM";
        }

        document.getElementById('mail-sender').value = currentMission.sender;
        document.getElementById('mail-receiver').value = currentMission.receiver;
        document.getElementById('mail-subject').value = currentMission.subject;
        document.getElementById('mail-body').value = currentMission.body;
        
        document.getElementById('mail-sound').play().catch(e => console.log(e));
        document.getElementById('calling-screen').style.display = 'none';
        document.getElementById('mail-screen').style.display = 'flex';
        
        currentIndex++; 
    }

    function finishMission() {
        document.getElementById('mail-screen').style.display = 'none';
        
        if (currentIndex >= missions.length) {
            document.getElementById('status-counter').innerText = "通信終了";
            document.querySelector('.trigger-btn').style.display = 'none';
            document.getElementById('intro-box').innerHTML = missions[currentIndex - 1].nextIntro;
        } else {
            document.getElementById('intro-box').innerHTML = missions[currentIndex - 1].nextIntro;
            document.getElementById('status-counter').innerText = `次の指示を受信します (${currentIndex + 1}/${missions.length})`;
        }
        
        document.getElementById('standby-screen').style.display = 'flex';
    }
</script>

</body>
</html>
