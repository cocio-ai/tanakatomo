<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>極秘業務指示システム</title>
<!-- バーコード読み取り用のライブラリ -->
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<style>
    body {
        font-family: "MS PGothic", "Hiragino Kaku Gothic ProN", sans-serif;
        background-color: #f0f0f0;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }
    .mobile-container {
        width: 100%;
        max-width: 400px;
        background-color: #ffffff;
        border: 2px solid #ccc;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        display: none;
    }
    #scan-screen {
        display: block;
        text-align: center;
        padding: 20px;
    }
    .header {
        background-color: #0033cc;
        color: #ffffff;
        font-size: 16px;
        font-weight: bold;
        text-align: center;
        padding: 8px 0;
        letter-spacing: 2px;
        margin-bottom: 15px;
    }
    .intro-text {
        font-size: 14px;
        color: #333;
        text-align: left;
        line-height: 1.5;
        border: 1px solid #ff9900;
        background-color: #ffffee;
        padding: 12px;
        margin-bottom: 20px;
        font-weight: bold;
    }
    #reader {
        width: 100%;
        margin-bottom: 15px;
        border: 2px solid #333;
        box-sizing: border-box;
    }
    .start-btn {
        background-color: #333;
        color: white;
        padding: 15px 20px;
        font-size: 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        width: 100%;
        font-weight: bold;
    }
    .director-credit {
        margin-top: 25px;
        font-size: 12px;
        color: #999;
        text-align: right;
    }
    .mail-form {
        padding: 10px;
    }
    .form-group {
        border-bottom: 1px dotted #999;
        padding: 8px 0;
        display: flex;
        align-items: center;
    }
    .form-group label {
        color: #0033cc;
        font-size: 14px;
        width: 50px;
        font-weight: bold;
    }
    .form-group input {
        border: none;
        outline: none;
        font-size: 16px;
        width: calc(100% - 60px);
        background-color: transparent;
        color: #333;
    }
    .body-group {
        padding: 10px 0;
    }
    .body-group label {
        color: #0033cc;
        font-size: 14px;
        font-weight: bold;
        display: block;
        margin-bottom: 5px;
    }
    .body-group textarea {
        width: 100%;
        height: 180px;
        border: 1px solid #ccc;
        font-size: 15px;
        padding: 8px;
        box-sizing: border-box;
        resize: none;
        background-color: #fafafa;
        line-height: 1.5;
    }
    .footer-buttons {
        display: flex;
        justify-content: space-between;
        padding: 10px;
        background-color: #e0e0e0;
        border-top: 1px solid #ccc;
    }
    .btn {
        background-color: #f8f8f8;
        border: 1px outset #ccc;
        padding: 10px 20px;
        font-size: 14px;
        cursor: pointer;
        width: 45%;
        text-align: center;
    }
    .btn:active {
        border: 1px inset #ccc;
    }
</style>
</head>
<body>

<!-- 1. スキャン画面 -->
<div id="scan-screen" class="mobile-container">
    <div class="header">i-mode ﾊﾞｰｺｰﾄﾞﾘｰﾀﾞ</div>
    
    <div class="intro-text">
        ブラック企業の社畜である皆さんは今日の主役である田中智先生の指示にすべて答える必要があります。<br><br>
        これから指示のアイコミを流しますので、それぞれしっかりと報告して下さい。
    </div>
    
    <div id="reader" style="display: none;"></div>
    
    <button id="start-btn" class="start-btn" onclick="startCamera()">スキャンを起動する</button>
    
    <div class="director-credit">
        directed by ファンタオナニスタ蟹江
    </div>
</div>

<!-- 2. メール画面 -->
<div id="mail-screen" class="mobile-container">
    <div class="header">ﾒｰﾙ受信</div>
    <div class="mail-form">
        <div class="form-group">
            <label>差出人</label>
            <input type="text" id="mail-sender" readonly>
        </div>
        <div class="form-group">
            <label>宛先</label>
            <input type="text" id="mail-receiver" readonly>
        </div>
        <div class="form-group">
            <label>件名</label>
            <input type="text" id="mail-subject" readonly>
        </div>
        <div class="body-group">
            <label>本文</label>
            <textarea id="mail-body" readonly></textarea>
        </div>
    </div>
    <div class="footer-buttons">
        <button class="btn" onclick="resetScreen()">次へ戻る</button>
        <button class="btn" onclick="alert('承知いたしました。')">確認</button>
    </div>
</div>

<audio id="ringtone" src="https://www.soundjay.com/buttons/sounds/button-09.mp3" preload="auto"></audio>

<script>
    // 順番通りに表示するためのミッション配列（順番固定）
    const missions = [
        { sender: "田中智", receiver: "吉野", subject: "本日の業務指示", body: "鉄雄を殴る花道になりきり『これはカニちゃんの分！』と言って乾杯の音頭を取りなさい" },
        { sender: "田中智", receiver: "森", subject: "本日の業務指示", body: "目の前のアルコールドリンクをすべて平らげた上で、田中先輩にSEJ関係者（店舗従業員含む）何人と関係を持ったか正確に報告せよ" },
        { sender: "田中智", receiver: "安藤", subject: "本日の業務指示", body: "あなたはカタギではないので、大人しくしていて下さい" },
        { sender: "田中智", receiver: "井上", subject: "本日の業務指示", body: "田中さんの乳首に人差し指を当てて北大出身の田中さんへ『智くんよ　大志を抱け』と言ってあげなさい" },
        { sender: "田中智", receiver: "冨澤", subject: "本日の業務指示", body: "財布にある一番大きな額のお札を田中智の胸ポケットにそっと入れなさい" },
        { sender: "田中智", receiver: "天野", subject: "本日の業務指示", body: "今はシュッとした出世頭になっているが、昔のかなりイキっていた頃の写真があるはず。それを皆に公開せよ" },
        { sender: "田中智", receiver: "谷", subject: "本日の業務指示", body: "あなたには未来があります、ここにいる連中とお付き合いするのは控えた方が良いと思います" },
        { sender: "田中智", receiver: "菊屋", subject: "本日の業務指示", body: "最近の奥さんとの性生活の状況を素直に答えなさい" },
        { sender: "田中智", receiver: "松崎", subject: "本日の業務指示", body: "あなたは関西出身なのでなにわのモーツァルト、キダタローのモノマネでもして周りを冷笑させなさい" },
        // 最後は蟹江さんからの送別の言葉
        { sender: "蟹江", receiver: "田中智", subject: "送別の言葉", body: "（ここに後ほどメッセージを記入します。準備ができたら教えてください）" }
    ];

    let currentIndex = 0; // 現在の順番を管理する変数
    let html5QrCode;

    function startCamera() {
        if (currentIndex >= missions.length) {
            alert("全てのアイコミ指示が完了しました。");
            return;
        }

        const ringtone = document.getElementById('ringtone');
        ringtone.volume = 0;
        ringtone.play().then(() => {
            ringtone.pause();
            ringtone.currentTime = 0;
            ringtone.volume = 1;
        }).catch(e => console.log("Audio init error:", e));

        document.getElementById('start-btn').style.display = 'none';
        document.querySelector('.intro-text').style.display = 'none'; // スキャン中は説明文を隠す
        document.getElementById('reader').style.display = 'block';

        html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 250, height: 250 } },
            (decodedText, decodedResult) => {
                html5QrCode.stop().then(() => {
                    document.getElementById('reader').style.display = 'none';
                    triggerSequentialMission();
                }).catch(err => console.log("カメラ停止エラー", err));
            },
            (errorMessage) => {}
        ).catch((err) => {
            alert("カメラを起動できませんでした。");
            resetScreen();
        });
    }

    function triggerSequentialMission() {
        const currentMission = missions[currentIndex];

        // 画面にデータをセット（差出人・宛先・件名・本文すべて動的に変更）
        document.getElementById('mail-sender').value = currentMission.sender;
        document.getElementById('mail-receiver').value = currentMission.receiver;
        document.getElementById('mail-subject').value = currentMission.subject;
        document.getElementById('mail-body').value = currentMission.body;

        const ringtone = document.getElementById('ringtone');
        ringtone.currentTime = 0;
        ringtone.play().catch(e => console.log("音声再生エラー:", e));

        setTimeout(() => {
            document.getElementById('scan-screen').style.display = 'none';
            document.getElementById('mail-screen').style.display = 'block';
            
            // 次の人のためにカウントを進める
            currentIndex++;
        }, 800);
    }

    function resetScreen() {
        document.getElementById('mail-screen').style.display = 'none';
        document.getElementById('scan-screen').style.display = 'block';
        document.getElementById('start-btn').style.display = 'block';
        document.querySelector('.intro-text').style.display = 'block';
    }
</script>

</body>
</html>
